name: Refresh weekly franchise rank history
on:
  workflow_run:
    workflows:
      - Refresh NFL-wide fantasy player statistics
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: huscffl-ranking-history
  cancel-in-progress: false
jobs:
  capture:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture completed-week official standings and HPI-F
        run: node scripts/build_rank_history.js
      - name: Commit new historical rankings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rank-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh weekly franchise rank history"
            git push
          fi
