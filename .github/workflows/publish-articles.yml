name: Publish HUSCFFL articles
on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'scripts/build_articles.py'
      - 'data/config.json'
      - '.github/workflows/publish-articles.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Markdown recaps and previews
        run: python scripts/build_articles.py
      - name: Commit generated stories when changed
        run: |
          if ! git diff --quiet -- data/stories.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/stories.json
            git commit -m "Publish HUSCFFL articles"
            git push
          fi
