name: Refresh NFL-wide fantasy player statistics
on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export weekly NFL player scores under league scoring rules
        run: python scripts/build_player_stats.py
      - name: Commit refreshed statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player-stats-*.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh NFL-wide HUSCFFL player statistics"
            git push
          fi
